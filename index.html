<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ultimate Werewolf Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <h1>Ultimate Werewolf Assistant</h1>

        <div class="topUtilityButtons">
            <button type="button" onclick="showGameGuide()"><span aria-hidden="true">ⓘ</span> Game Guide</button>
            <button id="gameSettingsButton" type="button" onclick="showGameSettings()" hidden><span aria-hidden="true">⚙</span> Game Settings</button>
            <button type="button" onclick="showDesignSettings()"><span aria-hidden="true">✦</span> Design</button>
            <button id="savedGamesButton" type="button" onclick="showSavedGames()" hidden><span aria-hidden="true">▣</span> Saved Games</button>
        </div>

        <div id="phaseHeader" class="phaseHeader" hidden></div>

        <div id="screen"></div>

    </div>

    <!-- Main application -->
    <script src="js/app.js"></script>
    <script src="js/game.js"></script>
    <script src="js/players.js"></script>
    <script src="js/actions.js"></script>
</body>

</html>
